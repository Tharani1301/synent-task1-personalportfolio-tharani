<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pet Owner Profile</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(120deg,#e8f5e9,#f1f8e9);
    padding:30px;
}

/* Main container */
.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:14px;
    box-shadow:0 15px 40px rgba(0,0,0,0.1);
    padding:30px;
}

h1{
    text-align:center;
    color:#2e7d32;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

/* Section card */
.section{
    margin-bottom:30px;
}

.section h2{
    font-size:18px;
    color:#2e7d32;
    border-left:4px solid #4caf50;
    padding-left:10px;
    margin-bottom:15px;
}

/* Grid layout */
.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap:15px;
}

input, select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

input:focus, select:focus{
    border-color:#4caf50;
    outline:none;
}

/* Checkbox style */
.checkbox-group label{
    display:block;
    margin:8px 0;
    color:#333;
}

/* Button */
button{
    width:100%;
    padding:14px;
    background:#2e7d32;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}
</style>
</head>

<body>

<div class="container">
    <h1>Pet Owner & Pet Profile</h1>
    <p class="subtitle">Please provide accurate details for better veterinary care</p>

    <!-- Owner Details -->
    <div class="section">
        <h2>Owner Information</h2>
        <div class="grid">
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email Address">
            <input type="text" placeholder="Mobile Number">
            <input type="text" placeholder="City">
            <input type="text" placeholder="Residential Address">
            <input type="text" placeholder="Emergency Contact">
        </div>
    </div>

    <!-- Pet Details -->
    <div class="section">
        <h2>Pet Information</h2>
        <div class="grid">
            <input type="text" placeholder="Pet Name">
            <select>
                <option>Pet Type</option>
                <option>Dog</option>
                <option>Cat</option>
                <option>Bird</option>
                <option>Other</option>
            </select>
            <input type="text" placeholder="Breed">
            <select>
                <option>Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>
            <input type="number" placeholder="Age (Years)">
            <input type="text" placeholder="Weight (kg)">
        </div>
    </div>

    <!-- Health -->
    <div class="section">
        <h2>Health & Vaccination Details</h2>
        <div class="grid">
            <select>
                <option>Vaccination Status</option>
                <option>Completed</option>
                <option>Pending</option>
            </select>
            <input type="date">
            <input type="text" placeholder="Known Allergies">
            <input type="text" placeholder="Existing Medical Conditions">
        </div>
    </div>

    <!-- Appointment Preference -->
    <div class="section">
        <h2>Appointment Preferences</h2>
        <div class="grid">
            <select>
                <option>Preferred Veterinarian</option>
                <option>Dr. Kumar</option>
                <option>Dr. Anitha</option>
            </select>
            <select>
                <option>Visit Type</option>
                <option>Routine Check-up</option>
                <option>Emergency</option>
            </select>
        </div>
    </div>

    <!-- Notifications -->
    <div class="section">
        <h2>Notifications & Alerts</h2>
        <div class="checkbox-group">
            <label><input type="checkbox"> Vaccination Reminders</label>
            <label><input type="checkbox"> Appointment Notifications</label>
            <label><input type="checkbox"> Pet Care Recommendations</label>
        </div>
    </div>

    <button onclick="go()">Save & Proceed to Data

</div>
